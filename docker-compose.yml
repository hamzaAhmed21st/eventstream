name: eventstream

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eventstream}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eventstream}
      POSTGRES_DB: ${POSTGRES_DB:-eventstream}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - eventstream

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - eventstream

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command:
      - sh
      - -c
      - >-
        uv run alembic upgrade head &&
        exec uv run uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port 8000
    environment:
      UV_NO_SYNC: "1"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-eventstream}:${POSTGRES_PASSWORD:-eventstream}@postgres:5432/${POSTGRES_DB:-eventstream}
      REDIS_URL: redis://redis:6379/0
      REDIS_STREAM: ${REDIS_STREAM:-eventstream:events}
      REDIS_CONSUMER_GROUP: ${REDIS_CONSUMER_GROUP:-eventstream-workers}
      REDIS_CONSUMER_NAME: ${REDIS_CONSUMER_NAME:-api}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "uv",
          "run",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - eventstream

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["uv", "run", "python", "-m", "app.workers.main"]
    environment:
      UV_NO_SYNC: "1"
      PYTHONPATH: backend
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-eventstream}:${POSTGRES_PASSWORD:-eventstream}@postgres:5432/${POSTGRES_DB:-eventstream}
      REDIS_URL: redis://redis:6379/0
      REDIS_STREAM: ${REDIS_STREAM:-eventstream:events}
      REDIS_CONSUMER_GROUP: ${REDIS_CONSUMER_GROUP:-eventstream-workers}
      REDIS_CONSUMER_NAME: ${REDIS_CONSUMER_NAME:-worker-1}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 15s
    restart: unless-stopped
    networks:
      - eventstream

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - eventstream

volumes:
  postgres-data:
  redis-data:

networks:
  eventstream:
    driver: bridge
